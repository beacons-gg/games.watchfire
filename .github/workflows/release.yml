# Release: on a version tag, build the game as standalone executables for Linux, macOS and
# Windows, and publish them as a GitHub release. Linux builds the bundle and the Linux executables;
# Windows and macOS each build their own from it: only on Windows does Bun give the Windows one its
# icon and details, and only on macOS can the Mac ones be signed so they run. Each OS runs its
# executables before anything is published.
#
#   1. Set "version" in apps/cli/package.json (say 0.2.0) and commit it.
#   2. git tag v0.2.0 && git push origin v0.2.0
#
# A tag with a suffix (v0.2.0-rc.1) makes a pre-release. Run it by hand (gh workflow run
# release.yml --ref <branch>) for a dry run: everything is built and checked, nothing published.
name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Bun builds the executables. Pinned, and to a release that has been out a while.
  BUN_VERSION: "1.4.4"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: The tag matches the game's version
        id: version
        env:
          TAG: ${{ github.ref_name }}
          TAGGED: ${{ github.ref_type == 'tag' }}
        run: |
          version=$(node -p 'require("./apps/cli/package.json").version')
          if [ "$TAGGED" = true ] && [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match apps/cli/package.json's version ($version). Tag v$version, or change the version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Typecheck and test
        run: |
          pnpm typecheck
          pnpm test
      - name: Bundle
        run: pnpm -C apps/cli run build
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Executables
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORMS: linux-x64 linux-arm64
        run: scripts/package-cli.sh "$VERSION" dist/release
      - name: It runs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # linux-arm64 is built the same way but not run: there's no arm64 Linux runner to count on.
        run: |
          mkdir check
          tar -xzf "dist/release/watchfire-$VERSION-linux-x64.tar.gz" -C check
          exe="check/watchfire-$VERSION-linux-x64/watchfire"
          test "$("$exe" --version)" = "$VERSION"
          "$exe" --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: |
            apps/cli/dist/watchfire.mjs
            apps/cli/dist/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
          retention-days: 7

  # The Windows executable, built on Windows from the same bundle, so it has its icon and its
  # details (Properties → Details). Then it's run, and both are checked.
  windows:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.build.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: apps/cli/dist
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Executable
        env:
          PLATFORMS: windows-x64
        run: scripts/package-cli.sh "$VERSION" dist/release
      - name: It runs, with its icon and details
        shell: pwsh
        run: |
          Expand-Archive "dist/release/watchfire-$env:VERSION-windows-x64.zip" -DestinationPath check
          $exe = "check/watchfire-$env:VERSION-windows-x64/watchfire.exe"
          $got = & $exe --version
          if ($got -ne $env:VERSION) { throw "--version said '$got', not '$env:VERSION'" }
          $info = (Get-Item $exe).VersionInfo
          $info | Format-List ProductName, FileDescription, CompanyName, LegalCopyright, FileVersion, ProductVersion
          if ($info.ProductName -ne "Watchfire" -or $info.CompanyName -ne "NorthCtrl" -or -not $info.FileDescription) {
            throw "The executable is missing its details."
          }
      - name: Its icon is in it
        run: |
          # Every image in the .ico is in the executable, byte for byte.
          python -I - apps/cli/assets/watchfire.ico "check/watchfire-$VERSION-windows-x64/watchfire.exe" <<'PY'
          import struct, sys
          ico, exe = (open(p, "rb").read() for p in sys.argv[1:])
          n = struct.unpack_from("<H", ico, 4)[0]
          parts = [struct.unpack_from("<II", ico, 6 + 16 * i + 8) for i in range(n)]
          missing = sum(ico[at:at + size] not in exe for size, at in parts)
          sys.exit(f"{missing} of the icon's {n} images aren't in the executable." if missing else 0)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  # The Mac executables, built on macOS from the same bundle and signed there (ad-hoc): Apple
  # silicon won't run an executable without a valid signature, and Bun's own signature on the
  # Intel build, made on Linux, comes out invalid. Then both are run, the Intel one under Rosetta.
  macos:
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: apps/cli/dist
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Executables
        env:
          PLATFORMS: macos-arm64 macos-x64
        run: scripts/package-cli.sh "$VERSION" dist/release
      - name: They run, signed
        run: |
          mkdir check
          for p in macos-arm64 macos-x64; do
            tar -xzf "dist/release/watchfire-$VERSION-$p.tar.gz" -C check
            codesign --verify --strict --verbose "check/watchfire-$VERSION-$p/watchfire"
          done
          arm="check/watchfire-$VERSION-macos-arm64/watchfire"
          test "$("$arm" --version)" = "$VERSION"
          "$arm" --help
          # Rosetta, to run the Intel build too.
          arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
          test "$(arch -x86_64 "check/watchfire-$VERSION-macos-x64/watchfire" --version)" = "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: [build, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Checksums
        working-directory: release
        run: sha256sum -- *.tar.gz *.zip > SHA256SUMS.txt
      - name: Notes
        run: |
          cat > notes.md <<EOF
          ## Play Watchfire on your own computer

          Download the one for your computer, unpack it, and run \`watchfire\` from a terminal. Nothing else to install.

          | Computer | Download |
          | --- | --- |
          | Windows (64-bit) | \`watchfire-$VERSION-windows-x64.zip\` |
          | Mac with Apple silicon (M1 and later) | \`watchfire-$VERSION-macos-arm64.tar.gz\` |
          | Mac with an Intel processor | \`watchfire-$VERSION-macos-x64.tar.gz\` |
          | Linux (64-bit) | \`watchfire-$VERSION-linux-x64.tar.gz\` |
          | Linux on ARM (64-bit) | \`watchfire-$VERSION-linux-arm64.tar.gz\` |

          **Windows:** unzip it, then in PowerShell or Windows Terminal, go to the folder and run \`.\\watchfire.exe\`. Windows may warn that the app is from an unknown publisher: choose *More info*, then *Run anyway*.

          **Mac:** this build isn't notarized by Apple yet, so macOS blocks it the first time. After unpacking, in Terminal:

          \`\`\`sh
          cd watchfire-$VERSION-macos-arm64        # or -macos-x64
          xattr -d com.apple.quarantine watchfire
          ./watchfire
          \`\`\`

          (Or try to run it once, then allow it under System Settings → Privacy & Security → *Open Anyway*.)

          **Linux:** \`tar -xzf watchfire-$VERSION-linux-x64.tar.gz && ./watchfire-$VERSION-linux-x64/watchfire\`

          **Your keeper** (your key, and your game) is kept in your home folder, not next to the program, so a new version picks up where you left off. It's the only copy: back it up the first time you play (in the game, **Y** then **K** shows its 12 words; \`watchfire import\` and those words bring it back on another computer).

          The game tells you on its main screen when a newer version is out. \`watchfire --help\` lists the rest. Each download has the licences of everything inside it. \`SHA256SUMS.txt\` has the checksums.
          EOF
      - name: Publish
        run: |
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" release/* \
            --verify-tag --title "Watchfire $VERSION" --notes-file notes.md --generate-notes "${flags[@]}"
