# Release: on a version tag, build the game as standalone executables for Linux, macOS and
# Windows, and publish them as a GitHub release. (Running each one on its own OS first, the
# `check` job, is off for now: remove its `if: false` and add it back to release's `needs`.)
#
#   1. Set "version" in apps/cli/package.json (say 0.2.0) and commit it.
#   2. git tag v0.2.0 && git push origin v0.2.0
#
# A tag with a suffix (v0.2.0-rc.1) makes a pre-release. Nothing else runs this workflow.
name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Bun builds the executables. Pinned, and to a release that has been out a while.
  BUN_VERSION: "1.4.4"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: The tag matches the game's version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./apps/cli/package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match apps/cli/package.json's version ($version). Tag v$version, or change the version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Typecheck and test
        run: |
          pnpm typecheck
          pnpm test
      - name: Bundle
        run: pnpm -C apps/cli run build
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Executables
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/package-cli.sh "$VERSION" dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  # Unpack each archive on its own OS and run the game's --version and --help. (linux-arm64 is
  # built the same way but not run: there's no arm64 Linux runner to count on.)
  check:
    if: false # off for now; see the top of this file
    needs: build
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-x64 }
          - { os: macos-15, platform: macos-arm64 }
          - { os: windows-2025, platform: windows-x64 }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Checksums
        shell: bash
        working-directory: release
        run: |
          if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS.txt; else shasum -a 256 -c SHA256SUMS.txt; fi
      - name: Run it (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -xzf "release/watchfire-$VERSION-$PLATFORM.tar.gz"
          exe="watchfire-$VERSION-$PLATFORM/watchfire"
          test "$("$exe" --version)" = "$VERSION"
          "$exe" --help
      - name: Signatures, and the Intel build under Rosetta (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Ad-hoc signatures from Bun: Apple Silicon won't run an unsigned executable at all.
          codesign --verify --verbose "watchfire-$VERSION-macos-arm64/watchfire"
          tar -xzf "release/watchfire-$VERSION-macos-x64.tar.gz"
          codesign --verify --verbose "watchfire-$VERSION-macos-x64/watchfire"
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            test "$(arch -x86_64 "watchfire-$VERSION-macos-x64/watchfire" --version)" = "$VERSION"
          else
            echo "No Rosetta on this runner: the Intel build is signed but wasn't run."
          fi
      - name: Run it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive "release/watchfire-$env:VERSION-$env:PLATFORM.zip" -DestinationPath .
          $exe = "watchfire-$env:VERSION-$env:PLATFORM/watchfire.exe"
          $got = & $exe --version
          if ($got -ne $env:VERSION) { throw "--version said '$got', not '$env:VERSION'" }
          & $exe --help

  release:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Notes
        run: |
          cat > notes.md <<EOF
          ## Play Watchfire on your own computer

          Download the one for your computer, unpack it, and run \`watchfire\` from a terminal. Nothing else to install.

          | Computer | Download |
          | --- | --- |
          | Windows (64-bit) | \`watchfire-$VERSION-windows-x64.zip\` |
          | Mac with Apple silicon (M1 and later) | \`watchfire-$VERSION-macos-arm64.tar.gz\` |
          | Mac with an Intel processor | \`watchfire-$VERSION-macos-x64.tar.gz\` |
          | Linux (64-bit) | \`watchfire-$VERSION-linux-x64.tar.gz\` |
          | Linux on ARM (64-bit) | \`watchfire-$VERSION-linux-arm64.tar.gz\` |

          **Windows:** unzip it, then in PowerShell or Windows Terminal, go to the folder and run \`.\\watchfire.exe\`. Windows may warn that the app is from an unknown publisher: choose *More info*, then *Run anyway*.

          **Mac:** this build isn't notarized by Apple yet, so macOS blocks it the first time. After unpacking, in Terminal:

          \`\`\`sh
          cd watchfire-$VERSION-macos-arm64        # or -macos-x64
          xattr -d com.apple.quarantine watchfire
          ./watchfire
          \`\`\`

          (Or try to run it once, then allow it under System Settings → Privacy & Security → *Open Anyway*.)

          **Linux:** \`tar -xzf watchfire-$VERSION-linux-x64.tar.gz && ./watchfire-$VERSION-linux-x64/watchfire\`

          Your keeper (your key, and your game) is kept in your home folder, not next to the program, so a new version picks up where you left off. \`watchfire --help\` lists the rest. Each download has the licences of everything inside it. \`SHA256SUMS.txt\` has the checksums.
          EOF
      - name: Publish
        run: |
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" release/* \
            --verify-tag --title "Watchfire $VERSION" --notes-file notes.md --generate-notes "${flags[@]}"
