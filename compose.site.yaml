# The website alone, no ssh door: a public site for a door that runs elsewhere. No database, no
# master key (it holds no keepers); its watch log goes in the site-data volume. In .env:
#
#   COMPOSE_FILE=compose.yaml:compose.site.yaml
#   WATCHFIRE_JOIN=ssh -p 2222 door.example.com    # the door it points to; unset shows only the download
#
# See docs/deploy.md.
services:
  door:
    depends_on: !reset {}
    environment:
      WATCHFIRE_DOOR_PORT: "0"
      WATCHFIRE_DOOR_DATABASE_URL: ""
    secrets: !reset []
    ports: !override
      - "${WATCHFIRE_WEB_PUBLIC_PORT:-8080}:8080"
    volumes:
      - site-data:/data

  db:
    # Only with --profile postgres: not started.
    profiles: [postgres]

secrets:
  master_key: !reset null
  db_password: !reset null

volumes:
  site-data:
