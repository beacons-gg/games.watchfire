# Deploy the Watchfire SSH door, its data kept in Postgres:
#
#   cp .env.example .env            # then edit it
#   echo "WATCHFIRE_MASTER_KEY=$(openssl rand -hex 32)" >> .env   # back this up separately!
#   echo "WATCHFIRE_DB_PASSWORD=$(openssl rand -hex 24)" >> .env
#   docker compose up -d --build
#   ssh -p 2222 <this host>
#
# On Dokploy (or any host with a settings page), put the two in its environment instead of .env.
# To keep the data in files (a Docker volume) instead, see compose.files.yaml. See docs/deploy.md.
name: watchfire

services:
  door:
    build:
      context: .
      dockerfile: apps/door/Dockerfile
    image: ${WATCHFIRE_IMAGE:-watchfire-door:latest}
    init: true
    restart: unless-stopped
    ports:
      # Players dial ${WATCHFIRE_DOOR_PUBLIC_PORT}; 22 if this host's own sshd has moved elsewhere.
      - "${WATCHFIRE_DOOR_PUBLIC_PORT:-2222}:2222"
      # The website: the game explained, the map of fires, the watch log, how to join.
      - "${WATCHFIRE_WEB_PUBLIC_PORT:-8080}:8080"
    environment:
      # The door's settings, from .env (or the host's settings page) when they're set; unset ones
      # take the door's own defaults. Named one by one, so the secrets reach it only as files.
      WATCHFIRE_SERVERS:
      WATCHFIRE_JOIN:
      WATCHFIRE_DOOR_MAX_SESSIONS:
      WATCHFIRE_DOOR_MAX_PER_IP:
      WATCHFIRE_DOOR_IDLE_MINUTES:
      WATCHFIRE_DOOR_MAX_MINUTES:
      WATCHFIRE_DOOR_WRITES_PER_MINUTE:
      WATCHFIRE_DOOR_MASTER_KEY_FILE: /run/secrets/master_key
      # So the website's join command names the port players dial, not the container's.
      WATCHFIRE_DOOR_PUBLIC_PORT: ${WATCHFIRE_DOOR_PUBLIC_PORT:-2222}
      # Everything the door keeps (host key, keepers, motd, bans, watch log), but the master key.
      # The db service below, unless .env names another Postgres (see compose.external-db.yaml).
      WATCHFIRE_DOOR_DATABASE_URL: ${WATCHFIRE_DOOR_DATABASE_URL:-postgres://watchfire@db:5432/watchfire}
      WATCHFIRE_DOOR_DATABASE_PASSWORD_FILE: /run/secrets/db_password
    secrets: [master_key, db_password]
    depends_on:
      db: { condition: service_healthy }
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # The door's database. Not published: only the door can reach it, on Compose's own network.
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: watchfire
      POSTGRES_DB: watchfire
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      # Back it up with pg_dump (docs/deploy.md); keep the master key apart from it.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchfire -d watchfire"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *logging

secrets:
  # From the environment (.env, or the host's settings page), handed to the containers as files
  # in /run/secrets. `up` stops with "WATCHFIRE_MASTER_KEY ... is not set" until they're there.
  master_key:
    environment: WATCHFIRE_MASTER_KEY
  db_password:
    environment: WATCHFIRE_DB_PASSWORD

volumes:
  db-data:
